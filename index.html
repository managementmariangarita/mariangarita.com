<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mari Angarita</title>
  <meta name="description" content="Cantautora colombiana. Escucha mi música, mira mis videos y conéctate conmigo." />
  <meta property="og:title" content="Mari Angarita" />
  <meta property="og:description" content="Cantautora colombiana. Escucha mi música y conéctate conmigo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1028; --bg2: #221535;
      --card: rgba(255,255,255,0.055); --card-h: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.09); --border-h: rgba(255,255,255,0.18);
      --text: #f0eaf8; --muted: rgba(240,234,248,0.50);
      --accent: #c4a0e8; --accent2: #f0c4d8;
      --tag-ev-bg: rgba(122,158,245,0.12); --tag-ev-t: #a0b8f5;
      --tag-mu-bg: rgba(29,185,84,0.12);  --tag-mu-t: #6ecf8e;
      --tag-vi-bg: rgba(255,68,68,0.12);  --tag-vi-t: #ff8a8a;
      --tag-en-bg: rgba(232,164,74,0.12); --tag-en-t: #e8c07a;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'DM Sans', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px 64px;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(140,80,200,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(200,100,160,0.10) 0%, transparent 60%);
    }
    .wrapper { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
    .avatar-wrap { position: relative; width: 86px; height: 86px; margin-bottom: 16px; }
    .avatar-ring { position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid rgba(196,160,232,0.35); }
    .avatar {
      width: 86px; height: 86px; border-radius: 50%;
      background: linear-gradient(135deg, #8a5cb5 0%, #c47ab0 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 28px; font-weight: 300;
      color: rgba(255,255,255,0.9); overflow: hidden; letter-spacing: 0.02em;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .artist-name { font-family: var(--serif); font-size: 28px; font-weight: 300; letter-spacing: 0.04em; color: var(--text); text-align: center; margin-bottom: 8px; }
    .artist-bio { font-size: 13px; font-weight: 300; color: var(--muted); text-align: center; line-height: 1.6; max-width: 300px; margin-bottom: 22px; }
    .social-row { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
    .social-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .social-btn:hover { border-color: var(--border-h); color: var(--text); background: var(--card-h); }
    .social-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .section-label { width: 100%; font-size: 10px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(240,234,248,0.28); margin-bottom: 10px; margin-top: 18px; padding-left: 2px; }
    .links-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .link-item {
      display: flex; align-items: center; gap: 13px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
      text-decoration: none; color: var(--text);
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
    }
    .link-item:hover { background: var(--card-h); border-color: var(--border-h); transform: translateY(-1px); }
    .link-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-icon svg { width: 18px; height: 18px; }
    .icon-evento     { background: var(--tag-ev-bg); color: var(--tag-ev-t); }
    .icon-musica     { background: var(--tag-mu-bg); color: var(--tag-mu-t); }
    .icon-video      { background: var(--tag-vi-bg); color: var(--tag-vi-t); }
    .icon-entrevista { background: var(--tag-en-bg); color: var(--tag-en-t); }
    .link-text { flex: 1; min-width: 0; }
    .link-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .link-sub { font-size: 11px; font-weight: 300; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .link-arrow { color: rgba(240,234,248,0.22); flex-shrink: 0; }
    .link-arrow svg { width: 14px; height: 14px; }
    .divider { width: 100%; height: 1px; background: var(--border); margin: 20px 0; }
    .contact-link {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 300;
      padding: 10px 14px; border-radius: 14px; border: 1px solid transparent; width: 100%;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .contact-link:hover { color: var(--text); border-color: var(--border); background: var(--card); }
    .contact-link svg { width: 15px; height: 15px; flex-shrink: 0; fill: currentColor; }
    footer { margin-top: 40px; font-size: 10px; color: rgba(240,234,248,0.18); letter-spacing: 0.06em; text-align: center; }
    .fade-in { opacity: 0; transform: translateY(14px); animation: fadeUp 0.5s ease forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="wrapper" id="app"><p style="color:rgba(240,234,248,0.3);font-size:13px;margin-top:80px;">Cargando...</p></div>
<footer id="footer"></footer>
<script>
const ICONS = {
  instagram:`<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>`,
  youtube:`<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
  tiktok:`<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>`,
  email:`<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`,
  spotify:`<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`,
  extLink:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`
};
const TIPO_META = {
  evento:     { cls:'icon-evento',     svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>` },
  musica:     { cls:'icon-musica',     svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>` },
  video:      { cls:'icon-video',      svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,3 19,12 5,21"/></svg>` },
  entrevista: { cls:'icon-entrevista', svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>` }
};
const LABEL = { evento:'Próximos shows', musica:'Música', video:'Videos', entrevista:'Entrevistas y prensa' };
const ORDER = ['evento','musica','video','entrevista'];

async function render() {
  const app = document.getElementById('app');
  let data;
  try {
    const res = await fetch('./links.json?v=' + Date.now());
    data = await res.json();
  } catch(e) {
    app.innerHTML = `<p style="color:rgba(240,234,248,0.4);font-size:13px;text-align:center;margin-top:80px;">No se encontró links.json</p>`;
    return;
  }

  const delay = i => `animation-delay:${i*0.07}s`;
  const avatarInner = data.foto
    ? `<img src="${data.foto}" alt="${data.nombre}" />`
    : data.nombre.split(' ').map(w=>w[0]).slice(0,2).join('');

  const redesHtml = (data.redes||[]).map(r=>`
    <a href="${r.url}" class="social-btn" target="_blank" rel="noopener" aria-label="${r.icono}">${ICONS[r.icono]||''}</a>`).join('');

  // Mantener orden del JSON, filtrar inactivos
  const activeLinks = (data.links||[]).filter(l => l.activo !== false);

  // Agrupar respetando el orden en que aparecen en el array
  const seen = new Set();
  let linksHtml = '';
  let cardIndex = 0;

  ORDER.forEach(tipo => {
    const grupo = activeLinks.filter(l => (l.tipo||'video') === tipo);
    if (!grupo.length) return;
    const meta = TIPO_META[tipo] || TIPO_META.video;
    linksHtml += `<p class="section-label fade-in" style="${delay(cardIndex++)}">${LABEL[tipo]||tipo}</p><div class="links-list">`;
    grupo.forEach(link => {
      cardIndex++;
      linksHtml += `<a href="${link.url}" class="link-item fade-in" style="${delay(cardIndex)}" target="_blank" rel="noopener">
        <div class="link-icon ${meta.cls}">${meta.svg}</div>
        <div class="link-text">
          <div class="link-title">${link.titulo}</div>
          ${link.subtitulo?`<div class="link-sub">${link.subtitulo}</div>`:''}
        </div>
        <div class="link-arrow">${ICONS.extLink}</div>
      </a>`;
    });
    linksHtml += `</div>`;
  });

  const contactoHtml = data.contacto ? `
    <div class="divider fade-in" style="${delay(cardIndex+1)}"></div>
    <a href="mailto:${data.contacto.email}" class="contact-link fade-in" style="${delay(cardIndex+2)}">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      ${data.contacto.texto||data.contacto.email}
    </a>` : '';

  app.innerHTML = `
    <div class="avatar-wrap fade-in" style="${delay(0)}"><div class="avatar-ring"></div><div class="avatar">${avatarInner}</div></div>
    <h1 class="artist-name fade-in" style="${delay(1)}">${data.nombre}</h1>
    <p class="artist-bio fade-in" style="${delay(2)}">${data.bio}</p>
    <div class="social-row fade-in" style="${delay(3)}">${redesHtml}</div>
    ${linksHtml}${contactoHtml}`;

  document.getElementById('footer').innerHTML = `<span class="fade-in" style="${delay(cardIndex+3)}">mariangarita.com</span>`;
}
render();
</script>
</body>
</html>
